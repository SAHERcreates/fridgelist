name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app (device)
        working-directory: FridgeList
        run: |
          xcodebuild \
            -project FridgeList.xcodeproj \
            -scheme FridgeList \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        working-directory: FridgeList
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/FridgeList.app" Payload/
          zip -r FridgeList.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FridgeList-ipa
          path: FridgeList/FridgeList.ipa
          retention-days: 30
